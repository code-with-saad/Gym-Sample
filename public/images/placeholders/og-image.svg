<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <circle cx="600" cy="315" r="283.5" fill="url(#glow)"/>

  <g transform="translate(600, 315)">
    <rect x="-160" y="-110" width="320" height="220" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" opacity="0.9"/>
    <rect x="-60" y="-90" width="120" height="24" rx="12" fill="#27272a" stroke="#F5A623" stroke-width="1"/>
    <text x="0" y="-74" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFD166" text-anchor="middle" letter-spacing="1.5">IRONFORGE</text>
    
    <!-- Dumbbell icon -->
    <path d="M-45 -25 h10 v50 h-10 z M-30 -15 h10 v30 h-10 z M-15 -4 h30 v8 h-30 z M20 -15 h10 v30 h-10 z M35 -25 h10 v50 h-10 z" fill="url(#gold)"/>

    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#F5F5F5" text-anchor="middle" letter-spacing="1">IRONFORGE FITNESS</text>
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#A1A1AA" text-anchor="middle">Lahore Premier Strength Club</text>
  </g>
</svg>